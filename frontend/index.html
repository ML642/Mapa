<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="%VITE_SITE_URL%" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mapa — Your guide to events in Warsaw</title>
    <meta
      name="description"
      content="%VITE_SITE_DESCRIPTION%"
    />

    <!-- Open Graph / Social -->
    <meta property="og:title" content="%VITE_OG_TITLE%" />
    <meta
      property="og:description"
      content="%VITE_OG_DESCRIPTION%"
    />
    <meta property="og:image" content="%VITE_SITE_URL%/mapa.svg" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:site_name" content="Mapa" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%VITE_OG_TITLE%" />
    <meta name="twitter:description" content="%VITE_OG_DESCRIPTION%" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Mapa",
      "url": "%VITE_SITE_URL%",
      "description": "%VITE_SITE_DESCRIPTION%",
      "inLanguage": "en",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "%VITE_SITE_URL%/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
